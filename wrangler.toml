# 這份放在 repo 根目錄，是為了讓 Cloudflare Workers Builds 用預設的
# Root directory「/」就找得到，不必在後台改任何建置設定。
name = "bbssfamily"
main = "line-bot/src/index.js"
compatibility_date = "2026-01-01"

# 只用一個排程：台北 21:30 = 13:30 UTC。
# 週日的下週討論清單接在同一則後面，不另外開排程——免費方案整個帳號只有
# 5 個 cron 額度，而且併成一則也少推一次、省訊息額度。
[triggers]
crons = ["30 13 * * *"]

[vars]
# 機器人回「一週」時附的網頁連結。頁面由這個 Worker 自己供應（見 src/page.js），
# 不放 GitHub Pages——那會把作息、小孩生日、接送時間公開到搜尋引擎上。
SITE_URL = "https://bbssfamily.brian-fan.workers.dev/"

# 待辦、使用者、長週期家事的完成日期都存在這裡。
# Cloudflare 後台的 KV instance「BBSS_family」。binding 名稱是程式裡讀的 env.FAMILY，
# 跟後台顯示的名字無關，不要改。
[[kv_namespaces]]
binding = "FAMILY"
id = "72600c3d09ef41928736899953b34461"
